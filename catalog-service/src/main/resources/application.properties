##############################################################
# CONFIGURAZIONE GENERALE APPLICAZIONE
##############################################################
# Nome identificativo del microservizio (usato anche da Actuator e Service Discovery)
spring.application.name=catalog-service

# Porta su cui rimane in ascolto il server web
server.port=8081

# Permette al server di terminare le richieste in corso prima di spegnersi (fondamentale per Docker/K8s)
server.shutdown=graceful

##############################################################
# CATALOG SERVICE - CUSTOM PROPERTIES
##############################################################
# Dimensione di default per la paginazione dei risultati (es. lista prodotti)
catalog.page-size=10

##############################################################
# ACTUATOR & MONITORING (GESTIONE E METRICHE)
##############################################################
# Mostra tutte le informazioni del commit git (branch, hash, user) nell'endpoint /info
management.info.git.mode=full

# Aggiunge il nome dell'app come tag a tutte le metriche inviate a Prometheus
management.metrics.tags.application=${spring.application.name}

# Disabilita il tracciamento distribuito (OpenTelemetry) per questo profilo (puoi attivarlo in prod)
management.tracing.enabled=false

# Probabilità di campionamento delle tracce (1.0 = 100% delle richieste tracciate)
management.tracing.sampling.probability=1.0

# Abilita la visualizzazione dello stato delle migrazioni Flyway tramite Actuator
management.endpoint.flyway.enabled=true

######## Actuator Configuration #########
management.endpoints.web.exposure.include=*
# Actuator Endpoints:
# Base URL: http://localhost:8081/actuator
# - Health: http://localhost:8081/actuator/health
# - Info: http://localhost:8081/actuator/info
# - Metrics: http://localhost:8081/actuator/metrics
# - Env: http://localhost:8081/actuator/env
# - Beans: http://localhost:8081/actuator/beans

# http://localhost:8081/actuator/health/liveness
management.endpoint.health.group.liveness.include=ping
# http://localhost:8081/actuator/health/readiness
management.endpoint.health.group.readiness.include=ping

##############################################################
# SWAGGER / OPENAPI CONFIGURATION
##############################################################
# URL dell'API Gateway per permettere a Swagger di generare i link corretti quando esposto esternamente
swagger.api-gateway-url=http://localhost:${server.port}

##############################################################
# DATABASE & PERSISTENCE (PostgreSQL, JPA, Flyway)
##############################################################
# URL di connessione al DB (usa la variabile d'ambiente DB_URL se presente, altrimenti il default locale)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/postgres}

# Username per il database (default: postgres)
spring.datasource.username=${DB_USERNAME:postgres}

# Password per il database (default: postgres)
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA & HIBERNATE ---
# Con Flyway, Hibernate deve solo validare che il codice Java corrisponda alle tabelle esistenti
spring.jpa.hibernate.ddl-auto=validate

# Disabilita l'anti-pattern che tiene aperta la connessione al DB durante il rendering della vista
spring.jpa.open-in-view=false

# Stampa le query SQL generate da Hibernate nella console (utile per debug)
spring.jpa.show-sql=true

# Formatta l'SQL stampato per renderlo leggibile su più righe
spring.jpa.properties.hibernate.format_sql=true

# Specifica il dialetto corretto per ottimizzare le query per PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- FLYWAY (MIGRAZIONI SCHEMA) ---
# Attiva il modulo Flyway all'avvio dell'applicazione
spring.flyway.enabled=true

# Se il database contiene già tabelle, crea una riga di 'baseline' nella cronologia migrazioni
spring.flyway.baseline-on-migrate=true

# Percorso dove Flyway cercherà gli script SQL (V1__init.sql, ecc.)
spring.flyway.locations=classpath:db/migration
